name: Generate Reliable GitHub Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:

# This forces GitHub to allow the action to save the file
permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics image
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: pranavbellamkonda10089
          template: classic
          base: header, activity, community, repositories
          config_theme: tokyo-night
          filename: custom-stats.svg
